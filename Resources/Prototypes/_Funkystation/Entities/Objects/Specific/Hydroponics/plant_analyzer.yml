- type: entity
  parent: BaseItem
  id: HandheldPlantAnalyzer
  name: plant analyzer
  description: A hand-held body scanner capable of distinguishing vital signs of the subject.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/healthanalyzer.rsi
    layers:
    - state: icon
    - state: analyzer
      shader: unshaded
  - type: Item
    heldPrefix: analyzer
    storedRotation: -90
  - type: ActivatableUI
    key: enum.PlantAnalyzerUiKey.Key
  - type: UserInterface
    interfaces:
      enum.PlantAnalyzerUiKey.Key:
        type: PlantAnalyzerBoundUserInterface
  - type: ItemToggle
    onUse: false
  - type: PlantAnalyzer
    scanningEndSound:
      path: "/Audio/Items/Medical/healthscanner.ogg"
