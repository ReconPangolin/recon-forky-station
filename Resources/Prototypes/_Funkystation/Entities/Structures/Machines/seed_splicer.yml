- type: entity
  parent: BaseMachinePowered
  id: SeedSplicer
  name: seed splicer
  description: combine seeds
  components:

  - type: Sprite
    sprite: Structures/Machines/seed_extractor.rsi
    snapCardinals: true
    layers:
    - state: seedextractor-off
    - state: seedextractor-unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
  - type: ActivatableUI
    key: enum.SeedSplicerUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.SeedSplicerUiKey.Key:
        type: SeedSplicerBoundUserInterface
  - type: SeedSplicer
    seedSlotLeft:
      whitelist:
        components:
        - Seed
    seedSlotRight:
      whitelist:
        components:
        - Seed
    resourceSlot:
      whitelist:
        tags:
        - RawMaterial
