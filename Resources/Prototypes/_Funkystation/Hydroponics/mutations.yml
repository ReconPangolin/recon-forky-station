- type: fuPlantMutation
  id: PlantHot
  plantEffects:
  - effects:
    - !type:Flammable
      multiplier: 3.75
      multiplierOnExisting: 0.75
    - !type:Ignite
    appliesToHarvester: true

- type: fuPlantMutation
  id: PlantShocking
  plantEffects:
  - effects:
    - !type:Electrocute
      siemensCoefficient: 0.5
    appliesToHarvester: true
